# Cấu hình SSH cho user `tunnel`: chỉ dùng để mở SOCKS tunnel từ máy local, không có shell.
# `setup-vps.sh` thay __TARGET__ (ví dụ 103.247.205.15:19000) rồi chép vào /etc/ssh/sshd_config.d/.
#
# Máy local chạy: ssh -D 127.0.0.1:1080 -N tunnel@<IP VPS>
# Mọi kết nối qua tunnel chỉ được đi tới đúng __TARGET__ (PermitOpen); đích khác sẽ bị từ chối.

Match User tunnel
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PubkeyAuthentication yes
	AllowTcpForwarding local
	PermitOpen __TARGET__
	PermitListen none
	GatewayPorts no
	X11Forwarding no
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	PermitTunnel no
	PermitTTY no
	ForceCommand /usr/sbin/nologin

# Kết thúc khối Match để các dòng cấu hình nạp sau không bị áp riêng cho user tunnel.
Match all
